<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>achung.portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --sky:      #dbe7fb;
      --periwinkle:#c9d8f5;
      --powder:   #e6f0fb;
      --seafoam:  #d6ecf2;
      --lavender: #e0dffb;
      --blush:    #fde7ec;
      --ink:      #3a4258;
      --ink-soft: #6c7591;
      --accent:   #7a9bd1;
	}

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      background: var(--powder);
      display: grid;
      place-items: center;
      position: relative;
      isolation: isolate;
    }

    /* bkgrnd */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.7;
      z-index: -1;
      animation: drift 18s ease-in-out infinite alternate;
    }
    .blob.b1 { width: 520px; height: 520px; background: var(--sky);  top: -120px; left: -100px; animation-duration: 22s; }
    .blob.b2 { width: 460px; height: 460px; background: var(--periwinkle);  bottom: -140px; right: -120px; animation-duration: 19s; }
    .blob.b3 { width: 380px; height: 380px; background: var(--seafoam);   top: 40%; left: 55%;  animation-duration: 25s; }
    .blob.b4 { width: 320px; height: 320px; background: var(--lavender);    top: 10%; right: 18%; animation-duration: 21s; }
    .blob.b5 { width: 280px; height: 280px; background: var(--blush); bottom: 8%; left: 12%; animation-duration: 24s; }

    @keyframes drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(30px, -20px) scale(1.08); }
      100% { transform: translate(-25px, 25px) scale(0.95); }
    }

    main {
      text-align: center;
      padding: 2rem;
      max-width: 640px;
      animation: fadeUp 1.2s ease-out both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 300;
      font-size: 1rem;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      margin-bottom: 1.25rem;
      opacity: 0;
      animation: fadeUp 1s ease-out 0.2s forwards;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-weight: 400;
      font-size: clamp(3rem, 10vw, 6rem);
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 1.75rem;
      opacity: 0;
      animation: fadeUp 1.1s ease-out 0.35s forwards;
    }

    h1 em {
      font-style: italic;
      font-weight: 300;
      color: var(--accent);
    }

    .message {
      font-size: 1.0625rem;
      font-weight: 300;
      line-height: 1.7;
      color: var(--ink-soft);
      max-width: 28rem;
      margin: 0 auto;
      opacity: 0;
      animation: fadeUp 1s ease-out 0.55s forwards;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin: 2rem 0 1.5rem;
      opacity: 0;
      animation: fadeUp 1s ease-out 0.45s forwards;
    }

    .divider .line {
      width: 40px;
      height: 1px;
      background: var(--ink-soft);
      opacity: 0.4;
    }

    .divider .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1);   opacity: 1; }
      50%      { transform: scale(1.4); opacity: 0.5; }
    }

    .footer {
      position: absolute;
      bottom: 1.5rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8125rem;
      letter-spacing: 0.05em;
      color: var(--ink-soft);
      opacity: 0;
      animation: fadeUp 1s ease-out 0.8s forwards;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
  <div class="blob b5"></div>

  <main>
    <p class="eyebrow">welcome</p>
    <h1>Ashley <em>Chung</em></h1>

    <div class="divider">
      <span class="line"></span>
      <span class="dot"></span>
      <span class="line"></span>
    </div>

    <p class="message">
      ( page under construction )
    </p>
  </main>

  <p class="footer">— last update: 6 may —</p>
</body>
</html>
